<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>STRATES — banc d'essai</title>
<style>
  body { background:#14110e; color:#e6ddd0; font:13px/1.45 ui-monospace,Consolas,monospace; padding:14px; }
  h1 { color:#e0a33e; font-size:15px; letter-spacing:3px; margin:0 0 10px; }
  pre { margin:0; white-space:pre-wrap; }
  .ok { color:#7fae6a; } .ko { color:#c05a4c; } .hl { color:#e0a33e; }
</style>
</head>
<body>
<h1>STRATES — BANC D'ESSAI DU MOTEUR</h1>
<pre id="out">exécution…</pre>

<!-- Coquilles vides : le banc d'essai n'a ni interface ni sauvegarde. -->
<script>
  const UI = new Proxy({}, { get: () => undefined, set: () => true });
  function toast() {}
</script>

<script src="../js/utils.js"></script>
<script src="../js/content.js"></script>
<script src="../js/state.js"></script>
<script src="../js/engine.js"></script>

<script>
/* =========================================================================
   Joueur automatique : heuristique simple et honnête.
   À chaque décision : recherches d'abord (cumulatives), puis améliorations
   rentables, puis le meilleur outil au ratio (σ/s gagné) / (coût), en
   gardant toujours de quoi payer le mètre suivant.
   ========================================================================= */
const L = [];
const say = (s) => L.push(s);

let eventsResolved = 0;

function autoplay(seconds, marks) {
  const dt = 0.5;
  const hit = {};
  let t = 0, step = 0;

  while (t < seconds) {
    Engine.tick(dt);
    t += dt;

    /* Les événements attendent une réponse humaine. Le joueur simulé répond
       au hasard : c'est volontaire — on veut mesurer leur effet MOYEN sur la
       courbe, pas ce que donnerait un joueur qui choisit toujours le mieux. */
    if (S.pendingEvent) {
      const ev = BY_ID.event[S.pendingEvent];
      Engine.resolveEvent(S.pendingEvent, Math.floor(Math.random() * ev.choices.length));
      eventsResolved++;
    }

    /* Le joueur clique à la bêche : beaucoup au début (c'est la seule source
       de sédiment tant qu'on n'a aucun outil), puis de moins en moins.
       Sans ce comportement, la simulation reste bloquée à 0 σ pour toujours. */
    const cps = t < 180 ? 4 : t < 900 ? 1 : 0;
    for (let i = 0; i < cps * dt; i++) Engine.click();

    if (++step % 4 === 0) {
      for (const r of RESEARCH) Engine.buyResearch(r.id);

      for (const u of UPGRADES.concat(GLOBAL_UPGRADES)) {
        const visible = u.tool ? (S.tools[u.tool] || 0) >= u.need : S.bestDepth >= u.needDepth;
        if (visible && !S.upgrades[u.id] && S.sediment > u.cost * 1.6) Engine.buyUpgrade(u.id);
      }

      /* Outils : on achète en boucle le meilleur ratio (σ/s gagné)/(coût)
         tant que c'est abordable. L'ACHAT PASSE AVANT LA DESCENTE — sinon
         le joueur dépense tout dans le puits et ne produit jamais rien. */
      let guardBuy = 40;
      while (guardBuy-- > 0) {
        let best = null, bestRatio = 0;
        for (const tool of TOOLS) {
          if (!Engine.toolUnlocked(tool)) continue;
          const cost = Engine.toolCost(tool.id);
          if (cost > S.sediment) continue;
          const ratio = (tool.prod * S.calc.toolMult[tool.id]) / cost;
          if (ratio > bestRatio) { bestRatio = ratio; best = tool; }
        }
        if (!best) break;
        S.buyMode = 1;
        Engine.buyTool(best.id);
      }

      /* Descente : uniquement avec du surplus (3× le coût du mètre), pour
         garder de quoi continuer à investir. C'est l'arbitrage central du
         jeu — descendre ouvre du contenu, investir accélère tout. */
      if (!S.calc.autoDig) {
        let g = 500;
        while (g-- > 0 && S.sediment > Engine.digCost(S.depth) * 3 && Engine.descend(true)) {}
      }
    }

    for (const m of marks) if (!hit[m] && S.maxDepth >= m) hit[m] = t;
  }
  return hit;
}

const sci = (n) => !isFinite(n) ? '∞' : n < 1000 ? n.toFixed(2) : n.toExponential(2);
const fmtT = (s) => s == null ? '  — jamais' :
  s < 60 ? Math.round(s) + ' s' :
  s < 3600 ? Math.floor(s / 60) + ' min ' + Math.round(s % 60) + ' s' :
  (s / 3600).toFixed(2) + ' h';

/* =========================================================================
   STATISTIQUES SUR PLUSIEURS PARTIES

   POURQUOI : une partie contient beaucoup de hasard (tirage des artefacts,
   des événements, des paris). Sur une seule simulation, la profondeur
   atteinte en 8 h variait de 235 à 293 m — soit un écart AUSSI GRAND que
   les effets qu'on cherche à mesurer. Régler l'équilibrage sur un run unique
   revient à confondre le bruit avec le signal.

   On lance donc N parties et on lit la MÉDIANE (moins sensible à une partie
   extrême que la moyenne), avec l'étendue min–max pour juger de la dispersion.
   ========================================================================= */
const median = (a) => {
  const v = a.filter((x) => x != null).sort((x, y) => x - y);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};

/** Ligne « médiane [min – max] », avec le nombre de parties ayant atteint le jalon. */
function statLine(values, total, fmtOne) {
  const ok = values.filter((x) => x != null);
  if (!ok.length) return '  — jamais';
  const med = fmtOne(median(ok));
  const lo = fmtOne(Math.min(...ok)), hi = fmtOne(Math.max(...ok));
  const reach = ok.length < total ? `  (${ok.length}/${total} parties)` : '';
  return `${med.padStart(11)}   [${lo} – ${hi}]${reach}`;
}

/** Joue `n` parties complètes et renvoie les relevés de chacune. */
function runSeries(n, hours, marks, withPrestige, doctrine) {
  const runs = [];
  for (let i = 0; i < n; i++) {
    S = newGame();
    if (doctrine) S.doctrine = doctrine;
    Engine.computeStats();
    eventsResolved = 0;

    const hit = autoplay(hours * 3600, marks);
    const run = {
      hit, depth: S.depth, prod: S.calc.sedPerSec, knowledge: S.knowledge,
      events: eventsResolved, shards: Engine.shardsFor(S.maxDepth),
      research: Object.keys(S.research).length,
      artefacts: Object.keys(S.artefacts).length,
      prestige: !!S.calc.prestigeUnlocked,
    };

    if (withPrestige) {
      run.gained = Engine.doPrestige();
      eventsResolved = 0;
      run.hit2 = autoplay(hours * 3600, marks);
      run.depth2 = S.depth;
    }
    runs.push(run);
  }
  return runs;
}

/* ------------------------------------------------------------------ */
try {
  const MARKS = [10, 25, 50, 75, 100, 130, 170, 200, 230, 260, 300, 380, 470];
  const HOURS = 8;
  /* 25 parties : la série AVEC événements est bien plus dispersée que le
     témoin (les paris, les artefacts et les effets temporaires ajoutent du
     hasard). Avec 12 parties, la médiane de l'écart sautait de +2 % à +22 %
     d'une exécution à l'autre — c'est-à-dire qu'elle ne mesurait rien. */
  const RUNS = 25;      // série principale + groupe témoin
  const DOC_RUNS = 5;   // profil de chaque doctrine (4 doctrines × 5 parties)

  const t0 = performance.now();
  const runs = runSeries(RUNS, HOURS, MARKS, true);
  const ms = performance.now() - t0;

  say(`${RUNS} parties de ${HOURS} h simulées en ${(ms / 1000).toFixed(1)} s.`);
  say(`Colonnes : médiane   [minimum – maximum sur les ${RUNS} parties]\n`);

  say('JALONS DE PROFONDEUR — 1re fouille');
  for (const m of MARKS) {
    say(`   ${String(m).padStart(4)} m ${statLine(runs.map((r) => r.hit[m]), RUNS, fmtT)}`);
  }

  say('\nJALONS — après un comblement');
  for (const m of MARKS) {
    say(`   ${String(m).padStart(4)} m ${statLine(runs.map((r) => r.hit2[m]), RUNS, fmtT)}`);
  }

  say('\nRÉSULTATS (médiane sur les ' + RUNS + ' parties)');
  const med = (f) => median(runs.map(f));
  say(`   profondeur 1re fouille  ${Math.round(med((r) => r.depth))} m` +
      `   [${Math.min(...runs.map((r) => Math.floor(r.depth)))} – ${Math.max(...runs.map((r) => Math.floor(r.depth)))}]`);
  say(`   profondeur 2e fouille   ${Math.round(med((r) => r.depth2))} m` +
      `   [${Math.min(...runs.map((r) => Math.floor(r.depth2)))} – ${Math.max(...runs.map((r) => Math.floor(r.depth2)))}]`);
  say(`   éclats au comblement    ${med((r) => r.gained)}`);
  say(`   événements par partie   ${med((r) => r.events)}  (1 par ${(HOURS * 60 / Math.max(1, med((r) => r.events))).toFixed(0)} min)`);
  say(`   recherches terminées    ${med((r) => r.research)} / ${RESEARCH.length}`);
  say(`   artefacts découverts    ${med((r) => r.artefacts)} / ${ARTEFACTS.length}`);
  say(`   prestige ouvert         ${runs.filter((r) => r.prestige).length}/${RUNS} parties`);

  /* ---- Groupe témoin : les mêmes parties, événements désactivés ----
     C'est la SEULE façon de mesurer l'effet réel d'un système : le comparer
     à son absence, à méthode identique et sur le même nombre de parties.
     Sans témoin, on compare un chiffre à un souvenir. */
  const savedChance = BAL.eventChance;
  BAL.eventChance = 0;
  const ctrl = runSeries(RUNS, HOURS, MARKS, false);
  BAL.eventChance = savedChance;

  const withEv = median(runs.map((r) => r.depth));
  const without = median(ctrl.map((r) => r.depth));
  say('\nEFFET DES ÉVÉNEMENTS (groupe témoin, événements désactivés)');
  say(`   sans événements   ${Math.round(without)} m   ` +
      `[${Math.min(...ctrl.map((r) => Math.floor(r.depth)))} – ${Math.max(...ctrl.map((r) => Math.floor(r.depth)))}]`);
  say(`   avec événements   ${Math.round(withEv)} m   ` +
      `[${Math.min(...runs.map((r) => Math.floor(r.depth)))} – ${Math.max(...runs.map((r) => Math.floor(r.depth)))}]`);
  const gap = (withEv / without - 1) * 100;
  say(`   écart             ${gap >= 0 ? '+' : ''}${gap.toFixed(1)} %` +
      `${Math.abs(gap) < 8 ? '   (dans la dispersion : effet neutre)' : '   ← À CORRIGER'}`);

  /* ---- Profil de chaque doctrine ----
     On les compare à partir de zéro, sur le même nombre de parties. On ne
     cherche PAS à ce qu'elles donnent le même résultat : on vérifie qu'aucune
     n'est absurde, et surtout que chacune produit une partie de FORME
     différente — sinon le choix n'en serait pas un. */
  say('\nPROFIL DES DOCTRINES (médiane sur ' + DOC_RUNS + ' parties de ' + HOURS + ' h, sans éclats de départ)');
  say('                    profondeur   artefacts   recherches      éclats');
  say('   objectif visé :               COLLECTION              PROGRESSION');
  for (const d of DOCTRINES) {
    const rs = runSeries(DOC_RUNS, HOURS, MARKS, false, d.id);
    const p = Math.round(median(rs.map((r) => r.depth)));
    const a = median(rs.map((r) => r.artefacts));
    const re = median(rs.map((r) => r.research));
    const sh = median(rs.map((r) => r.shards));
    say(`   ${d.name.padEnd(16)} ${String(p).padStart(6)} m ${String(a).padStart(10)}` +
        ` ${String(re).padStart(11)} ${String(sh).padStart(11)}`);
  }
  say('   → chaque doctrine doit dominer UNE colonne, pas toutes.');

  say('\nDERNIÈRE PARTIE — détail');
  say(`   profondeur       ${Math.floor(S.depth)} m   (record ${Math.floor(S.bestDepth)} m)`);
  say(`   production       ${sci(S.calc.sedPerSec)} σ/s`);
  say(`   multiplicateur   ×${sci(S.calc.prodMult)}`);
  say(`   coût du mètre    ${sci(Engine.digCost(S.depth))} σ`);
  say(`   savoir           ${sci(S.knowledge)} ✦`);
  say(`   recherches       ${Object.keys(S.research).length} / ${RESEARCH.length}`);
  say(`   artefacts        ${Object.keys(S.artefacts).length} / ${ARTEFACTS.length} types`);
  say(`   améliorations    ${Object.keys(S.upgrades).length} / ${UPGRADES.length + GLOBAL_UPGRADES.length}`);
  say(`   succès           ${Object.keys(S.achievements).length} / ${ACHIEVEMENTS.length}`);
  say(`   outils           ${TOOLS.map((t) => (S.tools[t.id] || 0)).join(' · ')}`);
  say(`   éclats si reset  ${Engine.shardsFor(S.maxDepth)}`);

  say('\nCOURBE DU PUITS (coût brut, hors réductions)');
  for (const d of [0, 15, 40, 75, 120, 170, 230, 300, 380, 470]) {
    const st = Engine.strataAt(d);
    say(`   ${String(d).padStart(4)} m  ${st.name.padEnd(23)} ${sci(BAL.digBase * Math.pow(1 + BAL.digGrowth, d) * st.hardness).padStart(10)} σ`);
  }

  /* ---- Contrôles de cohérence ---- */
  say('\nCONTRÔLES');
  const checks = [
    ['formatage 0',        fmt(0) === '0'],
    ['formatage 1234',     fmt(1234).includes('K')],
    ['formatage 1e30',     fmt(1e30).includes('e')],
    ['pas de NaN sédiment', isFinite(S.sediment) && !isNaN(S.sediment)],
    ['pas de NaN prod',     isFinite(S.calc.sedPerSec)],
    ['coût mètre croissant', Engine.digCost(50) > Engine.digCost(10)],
    ['strates ordonnées',   STRATA.every((s, i) => i === 0 || s.depth > STRATA[i - 1].depth)],
    ['ids artefacts uniques', new Set(ARTEFACTS.map(a => a.id)).size === ARTEFACTS.length],
    ['ids outils uniques',    new Set(TOOLS.map(t => t.id)).size === TOOLS.length],
    ['prérequis recherche valides', RESEARCH.every(r => r.req.every(q => BY_ID.research[q]))],
    ['prérequis méta valides',      META.every(m => m.req.every(q => BY_ID.meta[q]))],
    ['chaque strate a des artefacts', STRATA.every(s => (ARTEFACTS_BY_STRATA[s.id] || []).length >= 3)],
    ['ids événements uniques', new Set(EVENTS.map(e => e.id)).size === EVENTS.length],
    ['événements : 2 choix min', EVENTS.every(e => e.choices && e.choices.length >= 2)],
    ['événements : strates existantes', EVENTS.every(e => !e.strata || e.strata.every(s => BY_ID.strata[s]))],
    ['événements : choix risqué → fail', EVENTS.every(e => e.choices.every(c => c.risk === undefined || c.fail))],
    ['buffs purgés', S.buffs.every(b => b.until > S.playTime)],
    ['événements déclenchés', runs.every(r => r.events > 10)],
    ['prestige atteignable partout', runs.every(r => r.prestige)],
    ['achat groupé cohérent', (() => { S.buyMode = 10; const a = Engine.toolCostBulk('pelle', 10); const b = Engine.toolCost('pelle', 0) + Engine.toolCost('pelle', 1); return a > b; })()],
    ['export/import',         (() => { const c = exportSave(); return typeof c === 'string' && c.length > 20; })()],
  ];
  let bad = 0;
  for (const [name, ok] of checks) { if (!ok) bad++; say(`   ${ok ? '[OK]' : '[KO]'} ${name}`); }
  say(bad ? `\n>>> ${bad} CONTRÔLE(S) EN ÉCHEC` : '\n>>> TOUS LES CONTRÔLES PASSENT');

  document.getElementById('out').textContent = L.join('\n');
} catch (e) {
  document.getElementById('out').innerHTML =
    '<span class="ko">ERREUR : ' + e.message + '</span>\n\n' + (e.stack || '') + '\n\n' + L.join('\n');
}
</script>
</body>
</html>
